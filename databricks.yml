bundle:
  name: databricks-practice

variables:
  storage_account:
    description: Storage Account

  keyvault_scope:
    description: Secret Scope

  environment:
    description: Environment Name

include:
  - resources/*.yml
  - jobs/*.yml
  - pipelines/*.yml
targets:

  dev:
    mode: production

    workspace:
      root_path: /Workspace/dev/databricks-practice

    variables:
      environment: DEV
      storage_account: devstorage001
      keyvault_scope: kv-dev-scope

  qat:
    mode: production

    workspace:
      root_path: /Workspace/qat/databricks-practice

    variables:
      environment: QAT
      storage_account: qatstorage001
      keyvault_scope: kv-qat-scope

